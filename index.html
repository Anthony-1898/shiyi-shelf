<script type="module">const STORAGE_KEY = 'shiyi.shelf.v1';
const emptyState = () => ({version:1,books:[],favorites:[],positions:[],lastView:{type:'home'}});
const keyOf = (bookId,cardId) => JSON.stringify([bookId,cardId]);
const ident = v => typeof v==='string' && /^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$/.test(v);
function str(v,label,max,optional=false){if(optional&&(v===undefined||v===null||v===''))return '';if(typeof v!=='string'||!v.trim()||v.length>max)throw Error(`${label}需为非空文字，且不超过 ${max} 字。`);return v.trim();}
function validateBook(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw)||raw.schemaVersion!==1)throw Error('这不是支持的卡片文件。请使用 schemaVersion 为 1 的 JSON 卡片文件。');
 if(!ident(raw.id)||raw.id==='favorites')throw Error('书目 id 需以字母或数字开头，只能包含字母、数字、短横线和下划线，最多80位。');
 if(!Array.isArray(raw.cards)||!raw.cards.length||raw.cards.length>3000)throw Error('每本书需包含 1–3000 张卡片。');
 const seen=new Set();
 return {schemaVersion:1,id:raw.id,title:str(raw.title,'书名',100),description:str(raw.description,'简介',300,true),cards:raw.cards.map((c,i)=>{
 if(!c||!ident(c.id)||seen.has(c.id))throw Error(`第 ${i+1} 张卡片的 id 缺失、格式不正确或重复。`);seen.add(c.id);
 return {id:c.id,question:str(c.question,`第 ${i+1} 张题目`,3000),answer:str(c.answer,`第 ${i+1} 张答案`,20000),chapter:str(c.chapter,'章节',120,true),source:str(c.source,'来源',300,true)};
 })};
}
function allCards(state){return state.books.flatMap(b=>b.cards.map((c,i)=>({...c,bookId:b.id,bookTitle:b.title,number:i+1,key:keyOf(b.id,c.id)})));}
function collection(state,id){const all=allCards(state);return id==='favorites'?all.filter(c=>state.favorites.includes(c.key)):all.filter(c=>c.bookId===id);}
function updatePlan(state,book){const old=state.books.find(b=>b.id===book.id);if(!old)return {kind:'new',added:book.cards.length,changed:0,removed:0};const previous=new Map(old.cards.map(c=>[c.id,c]));const ids=new Set(book.cards.map(c=>c.id));return {kind:JSON.stringify(old)===JSON.stringify(book)?'same':'update',added:book.cards.filter(c=>!previous.has(c.id)).length,changed:book.cards.filter(c=>previous.has(c.id)&&JSON.stringify(previous.get(c.id))!==JSON.stringify(c)).length,removed:old.cards.filter(c=>!ids.has(c.id)).length};}
function mergeBook(state,book){const next=structuredClone(state);const i=next.books.findIndex(b=>b.id===book.id);if(i<0)next.books.push(book);else next.books[i]=book;const valid=new Set(allCards(next).map(c=>c.key));next.favorites=next.favorites.filter(k=>valid.has(k));next.positions=next.positions.filter(p=>collection(next,p.collection).some(c=>c.key===p.key));return next;}
function loadState(raw){if(!raw)return emptyState();const s=JSON.parse(raw);if(s.version!==1||!Array.isArray(s.books)||!Array.isArray(s.favorites)||!Array.isArray(s.positions))throw Error('本机数据格式异常');const books=s.books.map(validateBook);if(new Set(books.map(b=>b.id)).size!==books.length)throw Error('书目重复');const state={...emptyState(),books,favorites:s.favorites.filter(x=>typeof x==='string'),positions:s.positions.filter(p=>p&&typeof p.collection==='string'&&typeof p.key==='string')};if(s.lastView?.type==='reader'&&typeof s.lastView.collection==='string')state.lastView=s.lastView;return state;}
function remember(state,id,key){const next=structuredClone(state);next.positions=next.positions.filter(p=>p.collection!==id);next.positions.push({collection:id,key});next.lastView={type:'reader',collection:id};return next;}
function searchCards(state,query){const words=query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);return words.length?allCards(state).filter(c=>words.every(w=>`${c.question} ${c.answer} ${c.chapter} ${c.bookTitle}`.toLocaleLowerCase().includes(w))):[];}

// Calendar days in Beijing time, independent of the phone's timezone.
function examDaysRemaining(now=new Date()){
 const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(now);
 const get=type=>Number(parts.find(p=>p.type===type).value);
 const today=Date.UTC(get('year'),get('month')-1,get('day'));
 return Math.max(0,Math.round((Date.UTC(2026,11,19)-today)/86400000));
}

// Books and lightweight reading metadata live separately: turning a card
// does not rewrite the imported book text.
function openShelfDB(factory=globalThis.indexedDB){return new Promise((resolve,reject)=>{if(!factory)return reject(Error('浏览器不支持 IndexedDB'));const request=factory.open('shiyi-shelf',1);request.onupgradeneeded=()=>{const db=request.result;db.createObjectStore('books',{keyPath:'id'});db.createObjectStore('meta');};request.onerror=()=>reject(request.error);request.onblocked=()=>reject(Error('请关闭其他书架页面后重试'));request.onsuccess=()=>{const db=request.result;db.onversionchange=()=>db.close();resolve(db);};});}
function readShelf(db){return new Promise((resolve,reject)=>{const tx=db.transaction(['books','meta'],'readonly');let books,meta;const b=tx.objectStore('books').getAll(),m=tx.objectStore('meta').get('state');b.onsuccess=()=>books=b.result;m.onsuccess=()=>meta=m.result;tx.oncomplete=()=>{if(!meta){resolve(null);return;}const order=meta.bookOrder||[];books.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));const {bookOrder,...rest}=meta;resolve({...rest,books});};tx.onabort=()=>reject(tx.error);tx.onerror=()=>reject(tx.error);});}
function writeShelf(db,state,booksChanged=false){return new Promise((resolve,reject)=>{
 const tx=db.transaction(booksChanged?['books','meta']:['meta'],'readwrite');
 tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('保存已中止'));
 try{if(booksChanged){const books=tx.objectStore('books');books.clear();state.books.forEach(book=>books.put(book));}const {books,...meta}=state;tx.objectStore('meta').put({...meta,bookOrder:books.map(b=>b.id)},'state');}

});}

let view={type:'home'},active=[],index=0,flipped=false,searchValue='',resultLimit=60,timer,pending=null;

async function commit(next,booksChanged=false){if(readOnly){notify('本机记录暂时无法读取，请重新打开页面后再试。');return false;}try{await writeShelf(db,next,booksChanged);state=next;storageError='';return true;}catch{storageError='浏览器存储不可用或空间不足，本次修改未保存。请检查可用空间。';notify('保存失败：浏览器存储不可用或空间不足。');document.querySelectorAll('.storage-warning').forEach(el=>el.textContent=storageError);return false;}}

function renderHome(){
 view={type:'home'};document.title='无问西东 · 我的背诵书架';root.innerHTML=`<main class="shell"><header class="topbar"><div class="brand"><span class="brand-mark" style="color:#f6f1df">${svg('book',23)}</span>无问西东</div><div class="top-actions"><span class="local-tag"><i></i>我的随身书架</span><button class="icon-button" data-about aria-label="使用说明">${svg('info',20)}</button></div></header><section class="hero"><div><div class="eyebrow">YOUR LITTLE LIBRARY</div><h1>把知识，慢慢记住。</h1><p class="exam-note"><span id="exam-countdown">距离考研还有${examDaysRemaining()}天。</span><br>大咪提醒你，持之以恒，也要注意身体哦！</p></div>${art}</section><div class="storage-warning" role="alert">${esc(storageError)}</div><div class="search-wrap">${svg('search',19)}<label class="visually-hidden" for="search">搜索全部书目、题目和答案</label><input id="search" type="search" placeholder="搜索书目、题目或答案" autocomplete="off" value="${esc(searchValue)}"><button class="clear-search" aria-label="清空搜索" ${searchValue?'':'hidden'}>×</button></div><div id="home-content"></div><footer class="footer"><span>书目与进度，仅保存在本机</span><span>日有所记，心有所获。</span></footer></main>`;
 $('#search').oninput=e=>{searchValue=e.target.value;resultLimit=60;$('.clear-search').hidden=!searchValue;renderHomeContent();};$('.clear-search').onclick=()=>{searchValue='';$('#search').value='';$('.clear-search').hidden=true;renderHomeContent();$('#search').focus();};bindAbout();renderHomeContent();
}
function renderHomeContent(){const area=$('#home-content');if(!area)return;
 if(searchValue.trim()){
 const results=searchCards(state,searchValue);area.innerHTML=`<div class="section-bar"><div class="section-title"><h2>搜索结果</h2><span class="count-badge">${results.length}</span></div><span class="muted" style="font-size:11px">搜索全部书目</span></div><div class="search-list">${results.slice(0,resultLimit).map((c,i)=>`<button class="search-result" data-result="${i}"><small>${esc(c.bookTitle)} · 第 ${c.number} 张${c.chapter?' · '+esc(c.chapter):''}</small><h3>${esc(c.question)}</h3><p>${esc(c.answer)}</p></button>`).join('')}</div>${!results.length?`<div class="no-results">${svg('search',32)}<h3>还没找到这张卡片</h3><p>${state.books.length?'试试更短的关键词，或换一种表达。':'先导入一本书，就可以搜索题目与答案了。'}</p></div>`:''}${results.length>resultLimit?'<button class="text-button" id="more-results">显示更多结果 ↓</button>':''}`;
 area.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{const c=results[Number(b.dataset.result)];openReader(c.bookId,c.key);});if($('#more-results'))$('#more-results').onclick=()=>{resultLimit+=60;renderHomeContent();};return;
 }
 const favorites=collection(state,'favorites').length;
 area.innerHTML=`<div class="section-bar"><div class="section-title"><h2>我的书架</h2><span class="count-badge">${state.books.length} 本</span></div><button class="text-button" data-import>${svg('plus',17)}导入卡片</button></div><div class="shelf"><button class="shelf-tile" id="favorites-tile"><div class="cover favorite-cover"><span class="cover-kicker">THE FAVORITES</span><span class="cover-title">收藏<br>卡片</span><span class="large-star">${svg('star',78)}</span><span class="cover-foot"><span>留住值得再读的</span><span>☆</span></span></div><div class="tile-meta"><strong>收藏卡片</strong><span>${favorites?`${favorites} 张 · 再读一遍`:'点亮星星，收进这里'}</span></div></button>${state.books.map((b,i)=>{const cards=collection(state,b.id);const p=state.positions.find(p=>p.collection===b.id);const n=p?cards.findIndex(c=>c.key===p.key)+1:0;return `<button class="shelf-tile" data-book="${esc(b.id)}"><div class="cover book-cover" data-color="${i%3}"><span class="cover-kicker">VOLUME ${String(i+1).padStart(2,'0')}</span><span class="cover-title">${esc(b.title)}</span><span class="cover-foot"><span>${b.cards.length} 张知识卡片</span>${svg('book',17)}</span></div><div class="tile-meta"><strong>${esc(b.title)}</strong><span>${n?`继续第 ${n} / ${b.cards.length} 张`:`${b.cards.length} 张 · 开始背诵`}</span></div></button>`;}).join('')}<button class="shelf-tile add-tile" data-import><div class="cover"><span class="plus-circle">＋</span><strong>放入一本新书</strong><small>导入卡片文件</small></div><div class="tile-meta"><strong>下一本，等你来读</strong><span>让书架慢慢丰富起来</span></div></button></div>${!state.books.length?`<aside class="empty-note">${svg('book',25)}<div><strong>你的第一本书，从这里开始</strong><p>点击「导入卡片」，选择整理好的卡片文件。<br>导入后，就能翻卡、收藏，随时继续背诵。</p></div></aside>`:''}`;
 $('#favorites-tile').onclick=()=>openReader('favorites');area.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>openReader(b.dataset.book));area.querySelectorAll('[data-import]').forEach(b=>b.onclick=openImport);
}
async function openReader(id,key,replace=false){if(busy)return;busy=true;active=collection(state,id);const saved=state.positions.find(p=>p.collection===id)?.key;const found=active.findIndex(c=>c.key===(key||saved));index=Math.max(0,found);view={type:'reader',collection:id};flipped=false;const url=new URL(location.href);url.hash='read='+encodeURIComponent(id);if(replace)history.replaceState({reader:true},'',url);else history.pushState({reader:true},'',url);await savePosition();renderReader();window.scrollTo(0,0);busy=false;}
async function savePosition(){if(active[index])await commit(remember(state,view.collection,active[index].key));else{const next=structuredClone(state);next.lastView=view;await commit(next);}}
async function goHome(){if(busy)return;busy=true;view={type:'home'};const next=structuredClone(state);next.lastView=view;await commit(next);history.replaceState({},'',location.pathname+location.search);renderHome();window.scrollTo(0,0);busy=false;}
function renderReader(){
 const isFavorites=view.collection==='favorites';const book=state.books.find(b=>b.id===view.collection);const title=isFavorites?'收藏卡片':book?.title||'书目';document.title=title+' · 无问西东';
 root.innerHTML=`<main class="reader-shell"><header class="reader-header"><button class="back-button" id="back-home">${svg('left',17)}书架</button><div class="reader-title">${esc(title)}</div><button class="icon-button" data-about aria-label="使用说明">${svg('info',19)}</button></header><div class="storage-warning" role="alert">${esc(storageError)}</div><section id="reading"></section></main>`;
 $('#back-home').onclick=goHome;bindAbout();renderCard();
}
function renderCard(){const section=$('#reading');if(!section)return;const c=active[index];if(!c){section.innerHTML=`<div class="reader-empty"><div style="display:flex;justify-content:center;color:#b0a17b;margin-bottom:25px">${svg('star',52)}</div><h1>${view.collection==='favorites'?'还没有收藏卡片':'这本书还没有卡片'}</h1><p>读到想再看的内容，点亮卡片上的星星。</p><button class="nav-button primary" id="empty-home">返回书架</button></div>`;$('#empty-home').onclick=goHome;return;}
 const starred=state.favorites.includes(c.key),last=index===active.length-1;
 section.innerHTML=`<div class="reader-progress" aria-label="第 ${index+1} 张，共 ${active.length} 张"><span style="width:${(index+1)/active.length*100}%"></span></div><div class="reader-context"><span>${esc(view.collection==='favorites'?c.bookTitle:(c.chapter||'顺着书页，慢慢记住'))}</span><span>${String(index+1).padStart(2,'0')} <span style="opacity:.45">/ ${String(active.length).padStart(2,'0')}</span></span></div><div class="card-stage"><button class="icon-button star-button" id="star" aria-label="${starred?'取消收藏':'收藏卡片'}" aria-pressed="${starred}">${svg('star',23,starred)}</button><button class="flashcard ${flipped?'is-answer':''}" id="flip" aria-label="${flipped?'答案已展开，点击返回题目':'点击查看答案'}" aria-expanded="${flipped}"><div class="card-topline"><span class="card-label">${flipped?'答案':'题目'}</span>${flipped?'TAKE IT TO HEART':'A MOMENT TO RECALL'}</div><div class="card-content">${flipped?`<p class="answer-question">${esc(c.question)}</p><div class="answer-text">${esc(c.answer)}</div>`:`<h1>${esc(c.question)}</h1>`}</div>${flipped&&c.source?`<p class="source">来源：${esc(c.source)}</p>`:''}<div class="flip-hint">${svg('flip',14)}${flipped?'点击卡片，回到题目':'想一想，再点击查看答案'}</div></button></div><nav class="reader-nav" aria-label="切换卡片"><button class="nav-button" id="previous" ${index===0?'disabled':''}>${svg('left',17)}上一张</button><button class="nav-button primary" id="next">${last?'回到书架':'下一张'}${svg('right',17)}</button></nav>${last?'<p class="reader-end">这是本卡片集的最后一张。</p>':''}<p class="reader-save">${svg('check',14)}${storageError?'本次位置未保存，请查看上方提示':'位置已自动记住，下次接着读'}</p>`;
 $('#flip').onclick=()=>{flipped=!flipped;renderCard();$('#flip').focus({preventScroll:true});};
 $('#star').onclick=async()=>{if(busy)return;busy=true;const next=structuredClone(state);next.favorites=starred?next.favorites.filter(k=>k!==c.key):[...next.favorites,c.key];if(!await commit(next)){busy=false;return;}notify(starred?'已取消收藏':'已加入收藏卡片');if(view.collection==='favorites'&&starred){active=collection(state,'favorites');index=Math.min(index,Math.max(0,active.length-1));flipped=false;await savePosition();}renderCard();busy=false;};
 $('#previous').onclick=()=>move(-1);$('#next').onclick=()=>last?goHome():move(1);
}
async function move(delta){if(busy)return;if(index+delta<0||index+delta>=active.length)return;busy=true;index+=delta;flipped=false;await savePosition();renderReader();window.scrollTo(0,0);busy=false;}
function openImport(){pending=null;$('#import-file').value='';$('#import-preview').innerHTML='';$('#import-error').textContent='';$('#import-dialog').showModal();}
$('#import-file').onchange=async e=>{pending=null;$('#import-preview').innerHTML='';$('#import-error').textContent='';const file=e.target.files[0];if(!file)return;try{
 if(file.size>20*1024*1024)throw Error('文件超过 20 MB，请将资料拆成较小的书目。');
 let raw;try{raw=JSON.parse((await file.text()).replace(/^\uFEFF/,''));}catch{throw Error('文件无法读取为 JSON。请选择整理好的卡片文件，而不是 PDF 或 Word。');}
 pending=validateBook(raw);const plan=updatePlan(state,pending);if(plan.kind==='same'){pending=null;$('#import-preview').innerHTML='<div class="import-summary"><h3>这本书已经在书架上了</h3><p>文件内容相同，无需重复导入。</p></div>';return;}
 $('#import-preview').innerHTML=`<div class="import-summary"><h3>${esc(pending.title)}</h3><p>${pending.cards.length} 张卡片${pending.description?' · '+esc(pending.description):''}</p>${plan.kind==='update'?`<p>更新已有书目：新增 ${plan.added} 张，修改 ${plan.changed} 张，移除 ${plan.removed} 张。</p><p>保留编号相同的卡片的收藏和位置。被移除卡片的收藏会一并移除。</p>`:'<p>将作为一本新书，放入你的书架。</p>'}<button class="nav-button primary import-confirm" id="confirm-import">${plan.kind==='update'?'确认更新':'放上书架'}</button></div>`;
 $('#confirm-import').onclick=async()=>{if(!pending||busy)return;busy=true;$('#confirm-import').disabled=true;$('#confirm-import').textContent='正在保存…';const next=mergeBook(state,pending);next.lastView={type:'home'};if(!await commit(next,true)){busy=false;$('#confirm-import').disabled=false;$('#confirm-import').textContent='重试保存'; $('#import-error').textContent=storageError;return;}pending=null;$('#import-dialog').close();searchValue='';busy=false;await goHome();notify(plan.kind==='update'?'书目已更新':'新书已放上书架');};
 }catch(err){$('#import-error').textContent=err.message;}};
window.addEventListener('popstate',()=>{const id=location.hash.startsWith('#read=')?decodeURIComponent(location.hash.slice(6)):null;if(id)openReader(id,undefined,true);else goHome();});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible'||busy||readOnly)return;busy=true;try{const saved=await readShelf(db);if(saved){state=loadState(JSON.stringify(saved));if(view.type==='reader'){const key=active[index]?.key;active=collection(state,view.collection);index=Math.max(0,active.findIndex(c=>c.key===key));renderReader();}else renderHome();}}catch{notify('本机记录暂时无法读取，请重新打开页面。');}finally{busy=false;}});
window.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||view.type!=='reader'||e.target instanceof HTMLInputElement)return;if(e.key==='ArrowRight'){e.preventDefault();move(1);}if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}});
const initial=state.lastView;
if(initial.type==='reader'&&collection(state,initial.collection).length)openReader(initial.collection,undefined,true);else renderHome();
